# 作業ブランチ(nightly/issue-<番号> など)と PR でテストを回す。公開は pages.yml が行う。
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, nightly]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
